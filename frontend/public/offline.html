<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ORIKAM - Offline</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #111827;
    }

    .offline-container {
      width: 100%;
      max-width: 460px;
      padding: 45px 30px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
    }

    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
      background: #eff6ff;
      color: #2563eb;
      font-size: 22px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 25px;
    }

    p {
      margin: 0;
      color: #64748b;
      font-size: 14px;
      line-height: 1.7;
    }

    button {
      margin-top: 25px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <div class="offline-container">

    <div class="logo">
      O
    </div>

    <h1>You're offline</h1>

    <p>
      It looks like your internet connection is unavailable.
      Please reconnect and try again.
    </p>

    <button onclick="location.reload()">
      Try Again
    </button>

  </div>
</body>
</html>
